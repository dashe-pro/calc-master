server {
    listen 80;
    listen 443 ssl;
    server_name calcmasters.org www.calcmasters.org;

    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css text/javascript application/javascript application/json text/xml application/xml image/svg+xml;

    # ads.txt 直接响应
    location = /ads.txt {
        add_header Content-Type "text/plain; charset=utf-8";
        return 200 "google.com, pub-3329053918048012, DIRECT, f08c47fec0942fa0\n";
    }

    # robots.txt 直接响应
    location = /robots.txt {
        add_header Content-Type "text/plain; charset=utf-8";
        return 200 "User-agent: *\nAllow: /\nSitemap: https://calcmasters.org/sitemap.xml\n";
    }

    # 日志
    access_log /var/log/nginx/calc-master-access.log;
    error_log /var/log/nginx/calc-master-error.log;

    client_max_body_size 10M;

    # 工具页面缓存（1小时，减轻 Next.js 压力）
    location / {
        proxy_pass http://calc-master:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        add_header X-Cache-Status $upstream_cache_status;

        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 60s;
    }

    # 静态文件长期缓存
    location /_next/static {
        proxy_pass http://calc-master:3000;
        proxy_cache_valid 200 60m;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
